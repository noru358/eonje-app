name: live-qc

on:
  push:
    branches:
      - feat/live-data-v0.6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      STORE_SNAPSHOTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require live API secrets
        shell: bash
        run: |
          if [ -z "$SEOUL_API_KEY" ] || [ -z "$DATA_GO_KR_API_KEY" ]; then
            echo "Configure SEOUL_API_KEY and DATA_GO_KR_API_KEY as GitHub Actions secrets."
            exit 1
          fi
      - run: npm test
      - run: npm run qc:live:auto
      - name: Capture live product preview
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk

          npm start > live-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Preview server did not become healthy."
              exit 1
            fi
            sleep 1
          done

          google-chrome             --headless=new             --no-sandbox             --disable-gpu             --hide-scrollbars             --window-size=1440,1200             --virtual-time-budget=15000             --screenshot=live-preview.png             http://127.0.0.1:4173/
      - name: Upload QC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-qc-${{ github.run_id }}
          path: |
            live-qc.json
            live-qc-server.log
            live-preview.png
            live-preview-server.log
            data/snapshots/*.jsonl
          if-no-files-found: warn
