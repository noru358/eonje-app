<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d7e6f3" />
  <meta name="description" content="한강공원 실제 위치와 오늘의 추천 시간을 한 지도에서 비교합니다." />
  <title>언제 — 한강 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="/map.css" />
</head>
<body>
  <header class="map-topbar">
    <a class="brand" href="/">언제</a>
    <nav aria-label="주요 메뉴">
      <a href="/">홈</a>
      <a href="/map.html" aria-current="page">지도</a>
    </nav>
  </header>

  <main class="map-layout">
    <section class="map-copy">
      <p class="eyebrow">오늘 한강, 위치까지 같이 보기</p>
      <h1>어디가 좋은지<br>지도에서 바로 비교해.</h1>
      <p>실제 좌표 위에 지원 공원을 표시하고, 공원을 누르면 지금 조건과 가장 좋은 시간을 보여준다.</p>
      <div class="intent-list" id="intentList" aria-label="활동 선택"></div>
    </section>

    <section class="map-stage" aria-label="한강공원 실제 지도">
      <div id="map"></div>
      <aside class="park-panel" id="parkPanel" aria-live="polite">
        <p class="panel-kicker">공원을 선택해</p>
        <h2>지도 위 점을 눌러봐.</h2>
        <p>오늘의 추천 여부와 가장 좋은 시간을 바로 비교할 수 있다.</p>
      </aside>
    </section>

    <section class="park-strip" id="parkStrip" aria-label="한강공원 빠른 선택"></section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="/map.js"></script>
</body>
</html>
